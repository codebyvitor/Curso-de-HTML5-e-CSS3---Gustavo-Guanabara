<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table 2</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            width: 500px;
            border-collapse: collapse;
        }
        caption {
            background-color: rgb(123, 123, 123);
            font-weight: bold;
            font-size: 1.6em;
            padding: 10px;
            border: 1px solid black;
        }
        tbody tr:nth-child(2n) {
            background-color: gray;
        }
        td, th {
            border: 1px solid black;
            padding: 10px;
        }
        thead, tfoot {
            background-color: rgb(46, 46, 46);
            color: white;
        }
    </style>
</head>
<body>
    <h1>tabelas grandes</h1>
    <table>
        <caption>População das Unidades Federativas</caption>
        <thead>
            <tr> <!-- Primeira linha -->
                <th scope="col">Estado</th>
                <th scope="col">População</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>São Paulo</td>
                <td>46.289.333</td>
            </tr>
            <tr>
                <td>Minas Gerais</td>
                <td>21.168.791</td>
            </tr>
            <tr>
                <td>Rio de Janeiro</td>
                <td>17.264.791</td>
            </tr>
            <tr>
                <td>Bahia</td>
                <td>14.136.417</td>
            </tr>
            <tr>
                <td>Paraná</td>
                <td>11.444.380</td>
            </tr>
            <tr>
                <td>Rio Grande do Sul</td>
                <td>10.882.965</td>
            </tr>
            <tr>
                <td>Pernambuco</td>
                <td>9.058.931</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <th scope="row">Total</th>
                <td>203.080.756</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
